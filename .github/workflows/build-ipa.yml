# Сборка неподписанного MonoPlayer.ipa на Маке GitHub.
# Готовый файл: вкладка Actions → последний запуск → Artifacts → MonoPlayer-ipa.
# Дальше его подписывает и ставит на iPhone Sideloadly (см. README).
name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Нужно для публикации IPA в Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          echo "Доступные версии:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          echo "XCODE_VERSION=$(xcodebuild -version | head -1)" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MonoPlayer.xcodeproj \
            -scheme MonoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(Sendable|isolat|concurren)|BUILD (SUCCEEDED|FAILED)" || true
          if [ ! -d build/Build/Products/Release-iphoneos/MonoPlayer.app ]; then
            # Ошибки компиляции — в аннотации: их видно на странице запуска и через публичный API
            grep -E ": error: " build.log | sed -E 's#^.*/(MonoPlayer|MonoPlayerTests)/#\1/#' | sort -u | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MonoPlayer.app Payload/
          zip -qry MonoPlayer.ipa Payload
          ls -lh MonoPlayer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MonoPlayer-ipa
          path: MonoPlayer.ipa
          retention-days: 30

      # Прямая ссылка без входа в аккаунт:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/MonoPlayer.ipa
      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" MonoPlayer.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MonoPlayer — сборка ${{ github.run_number }}" \
            --notes "Неподписанный IPA для установки через Sideloadly. Собрано: ${XCODE_VERSION}, коммит ${GITHUB_SHA::7}." \
            --latest

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Run unit tests (simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          ')
          echo "Симулятор: $UDID"
          xcodebuild test \
            -project MonoPlayer.xcodeproj \
            -scheme MonoPlayer \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            -quiet 2>&1 | tee test.log || {
              grep -E ": error: |✘|failed" test.log | sed -E 's#^.*/(MonoPlayer|MonoPlayerTests)/#\1/#' | sort -u | head -10 \
                | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
