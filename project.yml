name: MonoPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Укажите свой Team ID (Xcode → Settings → Accounts) или выберите команду в Signing & Capabilities
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MonoPlayer:
    type: application
    platform: iOS
    sources:
      - path: MonoPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.monoplayer
        PRODUCT_NAME: MonoPlayer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: MonoPlayer/Info.plist
      properties:
        CFBundleDisplayName: MonoPlayer
        CFBundleDevelopmentRegion: ru
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Фоновое воспроизведение
        UIBackgroundModes:
          - audio
        # Импорт через «Поделиться» / «Открыть в MonoPlayer»
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.microsoft.waveform-audio
              - org.xiph.flac

  MonoPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MonoPlayerTests
    dependencies:
      - target: MonoPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.monoplayer.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MonoPlayer:
    build:
      targets:
        MonoPlayer: all
        MonoPlayerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MonoPlayerTests
